[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-news"
version = "0.1.0"
description = "MOEX news & reference pipeline (separate from the trading core)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.150",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "apscheduler>=3.10,<4",
  "feedparser>=6.0",
  "python-dateutil>=2.9",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]
nlp = [
  "transformers>=4.44",
  "torch>=2.4",
  "sentence-transformers>=3.1",
  "natasha>=1.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_news"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
