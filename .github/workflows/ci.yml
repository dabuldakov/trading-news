name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: news
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news -d news"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://news:news@localhost:5432/news
      SERVICE_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests + coverage
        run: >-
          pytest
          --cov=trading_news
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=75
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-coverage
          path: coverage.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trading-news:ci .
